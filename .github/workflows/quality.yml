name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: almide/almide
          ref: ce7cd75538fa4eb793b6c532c7a41f908ae90dbd
          path: .ci/almide
          persist-credentials: false
      - run: rustup toolchain install 1.94.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: compiler
        with:
          path: .ci/almide/target/release/almide
          key: almide-${{ runner.os }}-ce7cd75538fa4eb793b6c532c7a41f908ae90dbd-rust1.94.0
      - if: steps.compiler.outputs.cache-hit != 'true'
        run: cargo build --release --locked --bin almide --manifest-path .ci/almide/Cargo.toml
      - name: Tests, build and CLI smoke
        env:
          ALMIDE_BIN: ${{ github.workspace }}/.ci/almide/target/release/almide
        run: bash ci/check.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: O6lvl4/gramide-cli
          ref: 5f6767970bd9314aba8b24c0b8685e3bb81d1401
          path: .ci/gramide
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: O6lvl4/hew
          ref: d96ea3d18f0a6e42973da27c7ffca97644f8d9ab
          path: .ci/hew
          persist-credentials: false
      - name: Build pinned gramide
        working-directory: .ci/gramide
        env:
          ALMIDE_BIN: ${{ github.workspace }}/.ci/almide/target/release/almide
        run: '"$ALMIDE_BIN" build -o gramide'
      - name: Build pinned hew
        working-directory: .ci/hew
        env:
          ALMIDE_BIN: ${{ github.workspace }}/.ci/almide/target/release/almide
        run: '"$ALMIDE_BIN" build'
      - name: Real companion integration
        env:
          ALMIDE_BIN: ${{ github.workspace }}/.ci/almide/target/release/almide
          GRAMIDE_BIN: ${{ github.workspace }}/.ci/gramide/gramide
          HEW_BIN: ${{ github.workspace }}/.ci/hew/hew
        run: python3 ci/companions.py
