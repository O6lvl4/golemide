name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: almide/almide
          ref: 39f128a2d6af0cfc327d27913453e7af99c143fc # v0.65.1-rc3
          path: .ci/almide
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: compiler
        with:
          path: .ci/almide/target/release/almide
          key: almide-${{ runner.os }}-39f128a2d6af0cfc327d27913453e7af99c143fc-rust1.97.0
      - if: steps.compiler.outputs.cache-hit != 'true'
        run: cargo build --release --locked --bin almide --manifest-path .ci/almide/Cargo.toml
      - name: Tests, build and CLI smoke
        env:
          ALMIDE_BIN: ${{ github.workspace }}/.ci/almide/target/release/almide
        run: bash ci/check.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: O6lvl4/gramide-cli
          ref: 3dc76232a1ff4dd36950dfa707192cda0ce6105c
          path: .ci/gramide
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: O6lvl4/hew
          ref: bb19e492129b69fd032345b8d136588b2b9e1a90
          path: .ci/hew
          persist-credentials: false
      - name: Build pinned gramide
        working-directory: .ci/gramide
        env:
          ALMIDE_BIN: ${{ github.workspace }}/.ci/almide/target/release/almide
        run: '"$ALMIDE_BIN" build -o gramide'
      - name: Build pinned hew
        working-directory: .ci/hew
        env:
          ALMIDE_BIN: ${{ github.workspace }}/.ci/almide/target/release/almide
        run: '"$ALMIDE_BIN" build'
      - name: Real companion integration
        env:
          ALMIDE_BIN: ${{ github.workspace }}/.ci/almide/target/release/almide
          GRAMIDE_BIN: ${{ github.workspace }}/.ci/gramide/gramide
          HEW_BIN: ${{ github.workspace }}/.ci/hew/hew
        run: python3 ci/companions.py
